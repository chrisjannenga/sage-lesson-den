<title>Sage's Lesson Den</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one centered column, a hero card for today, tabs for Today / Catch-up / Week.
   Cat theme: tabby-orange cat mascot, paw-print check boxes, a cat that walks along the progress bar. */
:root {
  --bg: #F4EFFA;
  --surface: #FFFFFF;
  --surface-2: #EDE6F7;
  --ink: #2D2340;
  --muted: #6B5F82;
  --line: #DDD3EC;
  --accent: #E9803A;
  --accent-ink: #2D2340;
  --math: #3B4FC4;
  --math-soft: #E3E8FD;
  --ela: #A82D63;
  --ela-soft: #F9DFEA;
  --sci: #0B6E78;
  --sci-soft: #D6F0F2;
  --soc: #8A5200;
  --soc-soft: #FBE9C6;
  --read: #6A3FA3;
  --read-soft: #EADCF9;
  --done: #2E9E78;
  --done-soft: #D8F2E8;
  --warn: #A24710;
  --warn-soft: #FDE8D8;
  --fur: #F0A45D;
  --fur-dark: #CF7A33;
  --ear: #F4B8C5;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1530; --surface: #271F42; --surface-2: #322958; --ink: #F1EAFB; --muted: #B1A5CC;
    --line: #3D3363; --accent: #F29A57; --accent-ink: #1B1530; --math: #9EAEFF; --math-soft: #2B3366;
    --ela: #FF9AC1; --ela-soft: #4A2540; --sci: #6FD6DF; --sci-soft: #1B4448; --soc: #F2C26B; --soc-soft: #4A3A18; --read: #C9A6F5; --read-soft: #3E2D5E; --done: #55D3A4; --done-soft: #1E4A3E; --warn: #FFB27A;
    --warn-soft: #4A3020; --fur: #F0A45D; --fur-dark: #CF7A33; --ear: #D98FA2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1530; --surface: #271F42; --surface-2: #322958; --ink: #F1EAFB; --muted: #B1A5CC;
  --line: #3D3363; --accent: #F29A57; --accent-ink: #1B1530; --math: #9EAEFF; --math-soft: #2B3366;
  --ela: #FF9AC1; --ela-soft: #4A2540; --sci: #6FD6DF; --sci-soft: #1B4448; --soc: #F2C26B; --soc-soft: #4A3A18; --read: #C9A6F5; --read-soft: #3E2D5E; --done: #55D3A4; --done-soft: #1E4A3E; --warn: #FFB27A;
  --warn-soft: #4A3020; --fur: #F0A45D; --fur-dark: #CF7A33; --ear: #D98FA2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { width: 52px; height: 47px; flex: none; }
.brand h1 { font-size: 1.7rem; line-height: 1.1; }
.brand .date { color: var(--muted); font-weight: 600; font-size: .95rem; }
.tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 999px; }
.tab { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; font-weight: 700; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(45,35,64,.18); }
.badge { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: .78rem; padding: 1px 8px; font-weight: 800; }

main { display: grid; gap: 16px; margin-top: 18px; }

.hero { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center; }
.hero .mascot svg { width: 104px; height: 94px; display: block; }
.hero h2 { font-size: 1.5rem; }
.hero .sub { color: var(--muted); font-weight: 600; margin-top: 2px; }
.bar { position: relative; height: 16px; background: var(--surface-2); border-radius: 999px; margin: 22px 0 6px; }
.bar > .fill { height: 100%; background: var(--done); border-radius: 999px; transition: width .35s ease; min-width: 16px; }
.bar > .walker { position: absolute; top: -17px; width: 36px; height: 32px; transform: translateX(-50%); transition: left .35s ease; pointer-events: none; }
.bar > .walker svg { width: 100%; height: 100%; display: block; }
.stat { font-weight: 800; font-size: .95rem; }
.ok-note { color: var(--done); font-weight: 800; }

.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--warn-soft); color: var(--warn); border-radius: 16px; padding: 12px 16px; font-weight: 700; }
.pill-btn { border: 2px solid currentColor; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 800; }
.pill-btn:hover { background: var(--surface); }

.subj { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px 14px 8px; min-width: 0; }
.subj > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 6px; }
.subj h3 { font-size: 1.15rem; padding: 2px 12px; border-radius: 999px; }
.subj.math h3 { background: var(--math-soft); color: var(--math); }
.subj.ela h3 { background: var(--ela-soft); color: var(--ela); }
.subj.sci h3 { background: var(--sci-soft); color: var(--sci); }
.subj.soc h3 { background: var(--soc-soft); color: var(--soc); }
.subj.read h3 { background: var(--read-soft); color: var(--read); }
.subj .focus { color: var(--muted); font-weight: 700; font-size: .88rem; flex: 1 1 200px; min-width: 0; }
.subj .cnt { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }

.lesson { display: flex; align-items: flex-start; gap: 12px; padding: 10px 6px; border-top: 1px dashed var(--line); cursor: pointer; position: relative; }
.lesson:first-of-type { border-top: 0; }
.lesson input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.paw { flex: none; width: 34px; height: 34px; border-radius: 11px; border: 2.5px solid var(--line); background: var(--surface); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.paw svg { width: 22px; height: 22px; fill: var(--line); }
.lesson:hover .paw { border-color: var(--accent); }
.lesson input:checked + .paw { background: var(--done); border-color: var(--done); }
.lesson input:checked + .paw svg { fill: #fff; }
.lesson input:focus-visible + .paw { outline: 3px solid var(--accent); outline-offset: 2px; }
.ltxt { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-top: 3px; }
.lname { font-weight: 700; overflow-wrap: anywhere; }
.code { font-size: .78rem; font-weight: 800; letter-spacing: .06em; color: var(--muted); }
.lesson.is-done .lname { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--done); text-decoration-thickness: 2px; }

details.ahead { background: var(--surface); border: 2px dashed var(--line); border-radius: 20px; padding: 6px 14px 10px; }
details.ahead > summary { cursor: pointer; font-weight: 800; padding: 8px 0; font-family: var(--font-display); font-size: 1.05rem; }
details.ahead .subj { border: 0; padding: 4px 0 0; }

.empty { background: var(--surface); border: 2px dashed var(--line); border-radius: 20px; padding: 28px 18px; text-align: center; color: var(--muted); font-weight: 700; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 90px; height: 81px; }
.empty h2 { color: var(--ink); font-size: 1.3rem; }

.dayhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; margin: 6px 2px 8px; }
.dayhead h2 { font-size: 1.2rem; }
.dayhead .meta { color: var(--muted); font-weight: 700; font-size: .9rem; }
.linklike { border: 0; background: transparent; color: var(--accent); font-weight: 800; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
:root { --link: var(--ink); }

.weekbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.weekbar h2 { font-size: 1.3rem; }
.nav { display: flex; gap: 6px; }
.nav button { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 800; }
.nav button:hover { border-color: var(--accent); }
.weekgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.daycard { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 12px 12px 6px; min-width: 0; display: flex; flex-direction: column; }
.daycard.today { border-color: var(--accent); }
.daycard.off { background: transparent; border-style: dashed; color: var(--muted); }
.daycard header { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.daycard h3 { font-size: 1.05rem; }
.tag { font-size: .75rem; font-weight: 800; border-radius: 999px; padding: 1px 9px; }
.tag.today { background: var(--accent); color: var(--accent-ink); }
.tag.missed { background: var(--warn-soft); color: var(--warn); }
.tag.done { background: var(--done-soft); color: var(--done); }
.daycard .lesson { padding: 7px 2px; gap: 10px; }
.daycard .paw { width: 28px; height: 28px; border-radius: 9px; }
.daycard .paw svg { width: 18px; height: 18px; }
.daycard .lname { font-size: .92rem; }
.sublabel { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }
.sublabel.math { color: var(--math); }
.sublabel.ela { color: var(--ela); }
.sublabel.sci { color: var(--sci); }
.sublabel.soc { color: var(--soc); }
.sublabel.read { color: var(--read); }
.daycard footer { margin-top: auto; padding: 4px 0 6px; }

.foot { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; color: var(--muted); font-size: .88rem; font-weight: 600; }
.foot a { color: var(--ink); font-weight: 800; }
.hero.cheer .mascot svg { animation: hop .6s ease 2; }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-12px) rotate(-4deg); } }
@media (prefers-reduced-motion: reduce) {
  .hero.cheer .mascot svg { animation: none; }
  .bar > .fill, .bar > .walker { transition: none; }
}
@media (max-width: 520px) {
  .hero { grid-template-columns: 76px 1fr; padding: 14px; gap: 12px; }
  .hero .mascot svg { width: 76px; height: 68px; }
  .brand h1 { font-size: 1.4rem; }
  .tab { padding: 8px 12px; }
  .tabs { width: 100%; justify-content: space-between; }
  .tab { flex: 1; justify-content: center; }
}
</style>

</svg>

  <div class="top">
    <div class="brand">
      <span id="logo"></span>
      <div>
        <h1>Sage's Lesson Den</h1>

      <button class="tab" role="tab" data-tab="today" id="tab-today">Today</button>

      <button class="tab" role="tab" data-tab="week" id="tab-week">Week</button>
    </div>
  </div>

/* ---------- helpers ---------- */
const byDate = {};
DAYS.forEach(d => { byDate[d.d] = d; });
const FIRST = DAYS[0].d, LAST = DAYS[DAYS.length - 1].d;
const pad = n => String(n).padStart(2, '0');
const keyOf = dt => dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
const parse = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (k, n) => { const dt = parse(k); dt.setDate(dt.getDate() + n); return keyOf(dt); };
const fmt = (k, o) => parse(k).toLocaleDateString('en-US', o || { weekday: 'short', month: 'short', day: 'numeric' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayKey = () => keyOf(new Date());
function mondayOf(k) {
  const dt = parse(k); const wd = dt.getDay();
  if (wd === 6) dt.setDate(dt.getDate() + 2);
  else if (wd === 0) dt.setDate(dt.getDate() + 1);
  else dt.setDate(dt.getDate() - (wd - 1));
  return keyOf(dt);
}
function offLabel(k) {
  if (k === '2026-11-11') return 'Veterans Day';
  if (k >= '2026-11-25' && k <= '2026-11-27') return 'Thanksgiving break';
  if (k >= '2026-12-18' && k <= '2027-01-01') return 'Winter break';
  if (k === '2027-01-18') return 'MLK Day';
  if (k === '2027-02-15') return "Presidents Day";
  if (k >= '2027-03-08' && k <= '2027-03-12') return 'Spring break';
  if (k === '2027-03-26') return 'Spring holiday';
  if (k === '2027-05-31') return 'Memorial Day';
  if (k < FIRST) return 'Starts ' + fmt(FIRST);
  if (k > LAST) return 'School year complete';
  return 'No school';
}
const SUBJ = [
  { key: 'm', subj: 'Math', prefix: 'm-', title: 'Math', cls: 'math', ixl: true },
  { key: 'e', subj: 'ELA', prefix: 'e-', title: 'Language Arts', cls: 'ela', ixl: true },
  { key: 's', subj: 'Science', prefix: 's-', title: 'Science', cls: 'sci', ixl: true },
  { key: 'h', subj: 'Social', prefix: 'h-', title: 'Social Studies', cls: 'soc', ixl: false },
  { key: 'r', subj: 'Read', prefix: '', title: 'Reading & Writing', cls: 'read', ixl: false }
];
const SBY = {}; SUBJ.forEach(s => { SBY[s.subj] = s; });
function lessonsOf(day) {
  const out = [];
  SUBJ.forEach(s => (day[s.key] || []).forEach(x => out.push({ id: s.prefix + x[0], subj: s.subj, code: x[0], name: x[1], cat: x[2] })));
  return out;
}

/* ---------- state ---------- */
let tab = 'today';
let weekStart = mondayOf(todayKey());
let done = new Set();
let mode = 'local';          // 'db' once the shared store answers
let dbBlocked = false;       // true if a write was refused
let aheadOpen = false;
let cheer = false;
let focusId = null;
let queue = Promise.resolve();
const LS = 'sage-den-done-v1';

try { const raw = localStorage.getItem(LS); if (raw) done = new Set(JSON.parse(raw)); } catch (e) {}
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify([...done])); } catch (e) {} }

function countsFor(day) {
  const ls = lessonsOf(day); let n = 0;
  ls.forEach(l => { if (done.has(l.id)) n++; });
  return { total: ls.length, n };
}
function missedDays() {
  const t = todayKey();
  return DAYS.filter(d => d.d < t).map(d => ({ day: d, lessons: lessonsOf(d).filter(l => !done.has(l.id)) })).filter(x => x.lessons.length);
}
function nextDayAfter(k, inclusive) {
  return DAYS.find(d => inclusive ? d.d >= k : d.d > k) || null;
}

/* ---------- cat art ---------- */

  let eyes;
  if (mood === 'happy') eyes = '<path d="M30 46q6-9 12 0M58 46q6-9 12 0" fill="none" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/>';
  else if (mood === 'sleepy') eyes = '<path d="M30 46h12M58 46h12" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/><text x="74" y="22" font-size="11" font-weight="800" fill="var(--muted)" font-family="Nunito,sans-serif">z</text><text x="82" y="13" font-size="8" font-weight="800" fill="var(--muted)" font-family="Nunito,sans-serif">z</text>';
  else eyes = '<ellipse cx="36" cy="46" rx="4.6" ry="5.6" fill="var(--ink)"/><ellipse cx="64" cy="46" rx="4.6" ry="5.6" fill="var(--ink)"/><circle cx="37.6" cy="44" r="1.5" fill="#fff"/><circle cx="65.6" cy="44" r="1.5" fill="#fff"/>';
  return '<svg viewBox="0 0 100 90" role="img" aria-label="Cat">' +
    '<path d="M13 40 18 6 44 24z" fill="var(--fur)"/><path d="M87 40 82 6 56 24z" fill="var(--fur)"/>' +
    '<path d="M20 31 22 15 34 24z" fill="var(--ear)"/><path d="M80 31 78 15 66 24z" fill="var(--ear)"/>' +
    '<ellipse cx="50" cy="54" rx="38" ry="32" fill="var(--fur)"/>' +
    '<path d="M50 23v9M41 25l2 8M59 25l-2 8" stroke="var(--fur-dark)" stroke-width="3" stroke-linecap="round" fill="none"/>' +
    '<ellipse cx="50" cy="66" rx="15" ry="10" fill="#fff" opacity=".85"/>' +
    eyes +
    '<path d="M46 58h8l-4 5z" fill="var(--ela)"/>' +
    '<path d="M50 63q-3.5 5-8 2.5M50 63q3.5 5 8 2.5" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" fill="none"/>' +
    '<path d="M26 58 8 54M26 63 9 65M74 58 92 54M74 63 91 65" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>' +

/* ---------- views ---------- */
function codeLabel(l) {
  if (l.subj === 'Social') return 'IXL social studies';
  if (l.subj === 'Read') return l.cat;
  return 'IXL ' + l.code;
}
function rowHTML(l) {
  const on = done.has(l.id);
  return '<label class="lesson' + (on ? ' is-done' : '') + '">' +
    '<input type="checkbox" data-id="' + l.id + '"' + (on ? ' checked' : '') + '>' +
    '<span class="paw"><svg aria-hidden="true"><use href="#paw"/></svg></span>' +
    '<span class="ltxt"><span class="lname">' + esc(l.name) + '</span><span class="code">' + esc(codeLabel(l)) + '</span></span></label>';
}
function focusOf(ls) {
  const seen = [];
  ls.forEach(l => { if (seen.indexOf(l.cat) < 0) seen.push(l.cat); });
  return seen.join(' · ');
}
function subjectSection(s, ls) {
  if (!ls.length) return '';
  const n = ls.filter(l => done.has(l.id)).length;
  const focus = s.subj === 'Read' ? '' : focusOf(ls);
  return '<section class="subj ' + s.cls + '"><header><h3>' + s.title + '</h3>' +
    '<span class="focus">' + esc(focus) + '</span><span class="cnt">' + n + ' of ' + ls.length + '</span></header>' +
    ls.map(rowHTML).join('') + '</section>';
}
function daySections(day, filterFn) {
  let ls = lessonsOf(day);
  if (filterFn) ls = ls.filter(filterFn);
  return SUBJ.map(s => subjectSection(s, ls.filter(l => l.subj === s.subj))).join('');
}
function hero(title, sub, n, total, mood, cheerNow) {
  const pct = total ? Math.round(100 * n / total) : 0;
  const walkLeft = Math.min(96, Math.max(4, pct));
  return '<section class="hero' + (cheerNow ? ' cheer' : '') + '">' +
    '<div class="mascot">' + catSVG(mood) + '</div><div>' +
    '<h2>' + esc(title) + '</h2><div class="sub">' + esc(sub) + '</div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + n + '">' +
    '<div class="fill" style="width:' + pct + '%"></div><div class="walker" style="left:' + walkLeft + '%">' + catSVG(pct === 100 ? 'happy' : 'open') + '</div></div>' +
    '<div class="stat">' + n + ' of ' + total + ' done' + (pct === 100 ? ' <span class="ok-note">· Purr-fect!</span>' : '') + '</div>' +
    '</div></section>';
}
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning, Sage' : h < 17 ? 'Good afternoon, Sage' : 'Good evening, Sage';
}
function missedNotice() {
  const m = missedDays(); const n = m.reduce((a, x) => a + x.lessons.length, 0);
  if (!n) return '';
  return '<div class="notice"><span>' + n + ' lesson' + (n === 1 ? ' is' : 's are') + ' waiting in Catch-up.</span>' +
    '<button class="pill-btn" data-tab="catchup">Open Catch-up</button></div>';
}
function aheadBlock(fromKey) {
  const nx = nextDayAfter(fromKey, false);
  if (!nx) return '';
  const c = countsFor(nx);
  return '<details class="ahead"' + (aheadOpen ? ' open' : '') + '><summary>Work ahead: ' + esc(fmt(nx.d)) + ' · ' + c.n + ' of ' + c.total + ' done</summary>' +
    daySections(nx) + '</details>';
}

function viewToday() {
  const t = todayKey();
  const day = byDate[t];
  if (day) {
    const c = countsFor(day);
    const all = c.n === c.total;
    const mood = all ? 'happy' : c.n === 0 ? 'sleepy' : 'open';
    return hero(greeting(), 'Day ' + day.n + ' of ' + DAYS.length + ' · ' + fmt(t, { weekday: 'long', month: 'long', day: 'numeric' }), c.n, c.total, mood, cheer && all) +
      missedNotice() + daySections(day) + aheadBlock(t);
  }
  const nx = nextDayAfter(t, true);
  if (!nx) {
    return '<div class="empty">' + catSVG('happy') + '<h2>Every planned lesson is on the calendar</h2><span>Check the Catch-up tab for anything left over.</span></div>' + missedNotice();
  }
  const c = countsFor(nx);
  return '<div class="empty">' + catSVG('sleepy') + '<h2>No lessons today</h2><span>' + esc(offLabel(t)) + '. Next up: ' + esc(fmt(nx.d, { weekday: 'long', month: 'long', day: 'numeric' })) + '.</span></div>' +
    missedNotice() +
    '<div class="dayhead"><h2>Coming up: ' + esc(fmt(nx.d)) + '</h2><span class="meta">' + c.n + ' of ' + c.total + ' done</span></div>' + daySections(nx);
}

function viewCatchup() {
  const m = missedDays();
  if (!m.length) {
    return '<div class="empty">' + catSVG('happy') + '<h2>Nothing to catch up on</h2><span>Every lesson before today is checked off.</span></div>';
  }
  const total = m.reduce((a, x) => a + x.lessons.length, 0);
  let html = '<section class="hero"><div class="mascot">' + catSVG('open') + '</div><div><h2>Catch-up</h2><div class="sub">' + total +
    ' lesson' + (total === 1 ? '' : 's') + ' from earlier days. Oldest first.</div></div></section>';
  m.forEach(x => {
    html += '<div><div class="dayhead"><h2>' + esc(fmt(x.day.d, { weekday: 'long', month: 'long', day: 'numeric' })) + '</h2>' +
      '<span class="meta">' + x.lessons.length + ' left <button class="linklike" data-markday="' + x.day.d + '">Mark all done</button></span></div>' +
      daySections(x.day, l => !done.has(l.id)) + '</div>';
  });
  return html;
}

function viewWeek() {
  const t = todayKey();
  const keys = [0, 1, 2, 3, 4].map(i => addDays(weekStart, i));
  let total = 0, n = 0;
  keys.forEach(k => { const d = byDate[k]; if (d) { const c = countsFor(d); total += c.total; n += c.n; } });
  const pct = total ? Math.round(100 * n / total) : 0;
  let html = '<div class="weekbar"><h2>' + esc(fmt(keys[0], { month: 'short', day: 'numeric' })) + ' to ' + esc(fmt(keys[4], { month: 'short', day: 'numeric' })) + '</h2>' +
    '<div class="nav"><button data-week="-1" aria-label="Previous week">Back</button><button data-week="0">This week</button><button data-week="1" aria-label="Next week">Next</button></div></div>';
  html += '<section class="hero"><div class="mascot">' + catSVG(total && n === total ? 'happy' : 'open') + '</div><div><h2>This week\'s plan</h2><div class="sub">' +
    (total ? 'Check off extras any time to get ahead.' : 'No lessons this week.') + '</div>' +
    (total ? '<div class="bar"><div class="fill" style="width:' + pct + '%"></div></div><div class="stat">' + n + ' of ' + total + ' checked off</div>' : '') +
    '</div></section>';
  html += '<div class="weekgrid">';
  keys.forEach(k => {
    const d = byDate[k];
    const isToday = k === t;
    if (!d) {
      html += '<section class="daycard off' + (isToday ? ' today' : '') + '"><header><h3>' + esc(fmt(k)) + '</h3></header><div>' + esc(offLabel(k)) + '</div></section>';
      return;
    }
    const c = countsFor(d);
    let tag = '';
    if (c.n === c.total) tag = '<span class="tag done">Done</span>';
    else if (k < t) tag = '<span class="tag missed">' + (c.total - c.n) + ' missed</span>';
    else if (isToday) tag = '<span class="tag today">Today</span>';
    const ls = lessonsOf(d);
    html += '<section class="daycard' + (isToday ? ' today' : '') + '"><header><h3>' + esc(fmt(k)) + '</h3><span>' + tag + ' <span class="meta">' + c.n + '/' + c.total + '</span></span></header>' +
      SUBJ.map(s => { const sl = ls.filter(l => l.subj === s.subj); return sl.length ? '<div class="sublabel ' + s.cls + '">' + s.title + (s.subj === 'Read' ? '' : ' · ' + esc(focusOf(sl))) + '</div>' + sl.map(rowHTML).join('') : ''; }).join('') +
      '<footer>' + (c.n < c.total ? '<button class="linklike" data-markday="' + k + '">Mark all done</button>' : '') + '</footer></section>';
  });
  html += '</div>';
  return html;
}

/* ---------- render ---------- */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = tab === 'today' ? viewToday() : tab === 'catchup' ? viewCatchup() : viewWeek();
  ['today', 'catchup', 'week'].forEach(t => document.getElementById('tab-' + t).setAttribute('aria-selected', String(t === tab)));
  const m = missedDays().reduce((a, x) => a + x.lessons.length, 0);
  const b = document.getElementById('missed-badge');
  b.hidden = !m; b.textContent = m;
  document.getElementById('today-label').textContent = fmt(todayKey(), { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  document.getElementById('sync-note').textContent = mode === 'db' && !dbBlocked
    ? 'Progress saves automatically and follows you between devices.'
    : 'Progress is saved on this device.';
  if (focusId) {
    const el = app.querySelector('input[data-id="' + focusId + '"]');
    if (el) el.focus({ preventScroll: true });
  }
}

/* ---------- saving ---------- */
let dbRef = null;
function persist(id, on) {
  saveLocal();
  if (mode !== 'db' || dbBlocked || !dbRef) return;
  queue = queue.then(() => on ? dbRef.collection('done').doc(id).set({ at: Date.now() }) : dbRef.collection('done').doc(id).delete())
    .catch(err => { dbBlocked = true; render(); });
}
function setDone(id, on) {
  if (on) done.add(id); else done.delete(id);
  persist(id, on);
}
function todayAllDone() {
  const d = byDate[todayKey()];
  if (!d) return false;
  const c = countsFor(d);
  return c.total > 0 && c.n === c.total;
}

document.addEventListener('change', e => {
  const el = e.target;
  if (!el.matches || !el.matches('input[data-id]')) return;
  const was = todayAllDone();
  focusId = el.getAttribute('data-id');
  setDone(focusId, el.checked);
  cheer = !was && todayAllDone();
  render();
  if (cheer) setTimeout(() => { cheer = false; }, 2500);
});
document.addEventListener('click', e => {
  const t = e.target.closest ? e.target.closest('[data-tab],[data-markday],[data-week]') : null;
  if (!t) return;
  focusId = null;
  if (t.hasAttribute('data-tab')) { tab = t.getAttribute('data-tab'); render(); return; }
  if (t.hasAttribute('data-week')) {
    const v = Number(t.getAttribute('data-week'));
    weekStart = v === 0 ? mondayOf(todayKey()) : addDays(weekStart, 7 * v);
    render(); return;
  }
  if (t.hasAttribute('data-markday')) {
    const d = byDate[t.getAttribute('data-markday')];
    if (d) lessonsOf(d).forEach(l => { if (!done.has(l.id)) setDone(l.id, true); });
    render();
  }
});
document.getElementById('app').addEventListener('toggle', e => {
  if (e.target && e.target.classList && e.target.classList.contains('ahead')) aheadOpen = e.target.open;
}, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { weekStart = tab === 'week' ? weekStart : mondayOf(todayKey()); render(); } });

/* ---------- start ---------- */
document.getElementById('logo').innerHTML = catSVG('open');
render();
(async function connect() {
  try {
    const c = window.claude;
    if (!c || !c.use) return;
    const db = await c.use('db');
    if (!db) return;
    dbRef = db;
    mode = 'db';
    db.collection('done').onSnapshot(snap => {
      if (dbBlocked) return;
      done = new Set(snap.docs.map(d => d.id));
      saveLocal();
      render();
    }, err => { mode = 'local'; render(); });
    render();
  } catch (e) { mode = 'local'; render(); }
})();
</script>
